syntax = "proto3";

package network;

service Gateway {
    rpc ProcessRequest (GatewayRequest) returns (GatewayResponse) {}
}

message GatewayRequest {
    string ip = 1;
    int32 payload_size = 2;
    map<string, float> metrics = 3;
}

message GatewayResponse {
    string decision = 1; // allow, block, throttle
    int32 rate_limit_remaining = 2;
    string reason = 3;
}
