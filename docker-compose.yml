version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: niyanta_backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REDIS_HOST=redis
    volumes:
      - ./backend/app:/app/app
      - ./ml:/app/ml
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - niyanta_net

  redis:
    image: redis:alpine
    container_name: niyanta_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - niyanta_net

  frontend:
    build:
      context: ./frontend
    container_name: niyanta_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - niyanta_net

networks:
  niyanta_net:
    driver: bridge
