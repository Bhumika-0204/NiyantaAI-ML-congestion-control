apiVersion: apps/v1
kind: Deployment
metadata:
  name: niyanta-gateway-deployment
  labels:
    app: niyanta-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: niyanta-gateway
  template:
    metadata:
      labels:
        app: niyanta-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: fastapi-backend
        image: ghcr.io/your-username/niyanta-gateway-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis-cluster-svc.default.svc.cluster.local"
        - name: KAFKA_BROKER
          value: "kafka-broker-svc.default.svc.cluster.local:9092"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: niyanta-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: niyanta-gateway-deployment
  minReplicas: 3
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
